services:
  db:
    image: postgres:16-alpine
    container_name: jobmatch_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobmatch_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobmatch_password}
      POSTGRES_DB: ${POSTGRES_DB:-jobmatch_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: jobmatch_n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Phnom_Penh
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  n8n_data:
